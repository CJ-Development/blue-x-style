<!-- TOP FLOATING NAVBAR -->
<header class="navbar-wrapper">
  <div class="navbar-floating">
    <!-- Brand / Logo -->
    <a [routerLink]="['/']" class="brand-link" (click)="scrollToSection('inicio')">
      <div class="logo-frame">
        <img src="images/logo.jpg" alt="Blue X Style By Yeye" class="brand-img" />
      </div>
      <div class="brand-text">
        <span class="brand-title">BLUE X STYLE</span>
        <span class="brand-sub">BY YEYE · BOGOTÁ</span>
      </div>
    </a>

    <!-- Desktop Nav Links (3 opciones principales) -->
    <nav class="desktop-nav">
      <a [routerLink]="['/']" fragment="lookbook" (click)="scrollToSection('lookbook')" [class.active]="activeSection() === 'lookbook'" class="nav-item">Lookbook Real</a>
      <a [routerLink]="['/']" fragment="servicios" (click)="scrollToSection('servicios')" [class.active]="activeSection() === 'servicios'" class="nav-item">Servicios & Tarifas</a>
      <a [routerLink]="['/']" fragment="press-on" (click)="scrollToSection('press-on')" [class.active]="activeSection() === 'press-on'" class="nav-item">Press-On Nails</a>
    </nav>

    <!-- Actions: Theme Toggle & Single Clear CTA on desktop -->
    <div class="navbar-actions">
      <!-- Dark/Light Theme Button -->
      <button 
        (click)="themeService.toggleTheme()" 
        class="theme-toggle-btn"
        [title]="themeService.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        aria-label="Alternar tema">
        <!-- Sun icon -->
        <svg *ngIf="themeService.theme() === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon icon -->
        <svg *ngIf="themeService.theme() === 'light'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>

      <a [routerLink]="['/']" fragment="cotizador" (click)="scrollToSection('cotizador')" class="btn-primary nav-cta">
        <span>Cotizar Cita</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<!-- MOBILE BOTTOM NAVIGATION DOCK (Sin hamburguesa, navegación inferior nativa) -->
<nav class="mobile-bottom-dock" aria-label="Navegación móvil">
  <button 
    type="button"
    class="dock-item"
    [class.active]="activeSection() === 'inicio'"
    (click)="scrollToSection('inicio')"
    aria-label="Ir a Inicio">
    <div class="dock-icon-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <span class="dock-label">Inicio</span>
    <span class="active-dot" *ngIf="activeSection() === 'inicio'"></span>
  </button>

  <button 
    type="button"
    class="dock-item"
    [class.active]="activeSection() === 'lookbook'"
    (click)="scrollToSection('lookbook')"
    aria-label="Ir a Lookbook">
    <div class="dock-icon-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
        <circle cx="9" cy="9" r="2"/>
        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
      </svg>
    </div>
    <span class="dock-label">Lookbook</span>
    <span class="active-dot" *ngIf="activeSection() === 'lookbook'"></span>
  </button>

  <button 
    type="button"
    class="dock-item"
    [class.active]="activeSection() === 'servicios'"
    (click)="scrollToSection('servicios')"
    aria-label="Ir a Tarifas">
    <div class="dock-icon-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/>
        <path d="M7 7h.01"/>
      </svg>
    </div>
    <span class="dock-label">Tarifas</span>
    <span class="active-dot" *ngIf="activeSection() === 'servicios'"></span>
  </button>

  <button 
    type="button"
    class="dock-item"
    [class.active]="activeSection() === 'press-on'"
    (click)="scrollToSection('press-on')"
    aria-label="Ir a Press-On Nails">
    <div class="dock-icon-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    </div>
    <span class="dock-label">Press-On</span>
    <span class="active-dot" *ngIf="activeSection() === 'press-on'"></span>
  </button>

  <button 
    type="button"
    class="dock-item dock-item-highlight"
    [class.active]="activeSection() === 'cotizador'"
    (click)="scrollToSection('cotizador')"
    aria-label="Ir a Cotizador">
    <div class="dock-icon-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <span class="dock-label">Cotizar</span>
    <span class="active-dot" *ngIf="activeSection() === 'cotizador'"></span>
  </button>
</nav>
