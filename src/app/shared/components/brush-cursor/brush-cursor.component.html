<div 
  class="brush-cursor-container" 
  *ngIf="isVisible()"
  [class.painting]="isHovering()"
  [class.clicking]="isClicking()"
  [style.transform]="'translate3d(' + posX() + 'px, ' + posY() + 'px, 0)'">

  <!-- Wet Lacquer Droplet / Glow -->
  <div class="lacquer-drop"></div>

  <!-- Manicure Art Brush Icon -->
  <svg class="brush-icon" width="28" height="28" viewBox="0 0 32 32" fill="none">
    <!-- Pincel: Mango metálico cromo -->
    <path d="M26 4L22 8L16 14L14 18L18 20L22 18L28 12L30 6L26 4Z" fill="url(#brushMetalGradient)" stroke="#9bc7e6" stroke-width="0.8"/>
    <!-- Casquillo ferrule plateado -->
    <rect x="12" y="16" width="6" height="4" rx="1" transform="rotate(-45 12 16)" fill="#d1e3f0" stroke="#1f6c9f" stroke-width="0.6"/>
    <!-- Cerdas del pincel impregnadas de esmalte azul zafiro -->
    <path d="M10 20C8 22 5 26 3 29C6 29 10 27 12 25L10 20Z" fill="url(#nailPolishGradient)"/>
    <!-- Gota de brillo / esmalte húmedo en la punta -->
    <circle cx="3.5" cy="28.5" r="2" fill="#9bc7e6"/>

    <defs>
      <linearGradient id="brushMetalGradient" x1="14" y1="4" x2="30" y2="20" gradientUnits="userSpaceOnUse">
        <stop stop-color="#ffffff"/>
        <stop offset="0.5" stop-color="#9bc7e6"/>
        <stop offset="1" stop-color="#1f6c9f"/>
      </linearGradient>
      <linearGradient id="nailPolishGradient" x1="3" y1="20" x2="12" y2="29" gradientUnits="userSpaceOnUse">
        <stop stop-color="#1f6c9f"/>
        <stop offset="0.6" stop-color="#38bdf8"/>
        <stop offset="1" stop-color="#9bc7e6"/>
      </linearGradient>
    </defs>
  </svg>
</div>
