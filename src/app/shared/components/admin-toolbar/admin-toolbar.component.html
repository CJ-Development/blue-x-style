<!-- PANEL FLOTANTE EN EL LATERAL DERECHO (ESTILO CANVA) -->
<aside 
  *ngIf="catalogService.isAdmin()" 
  class="admin-floating-sidebar" 
  [class.collapsed]="isCollapsed()" 
  aria-label="Panel de administración lateral">
  
  <!-- Encabezado / Botón Minimizar -->
  <div class="sidebar-header" (click)="toggleCollapse()" [title]="isCollapsed() ? 'Expandir panel de administrador' : 'Minimizar panel'">
    <div class="admin-identity">
      <span class="admin-live-pulse"></span>
      <div class="identity-text" *ngIf="!isCollapsed()">
        <span class="identity-role">ADMIN YEYE</span>
        <span class="identity-hint">Editor en vivo</span>
      </div>
    </div>
    <button type="button" class="collapse-toggle-btn" aria-label="Minimizar o expandir">
      <svg *ngIf="!isCollapsed()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
      <svg *ngIf="isCollapsed()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <!-- Botones de Acción (Verticales en el lateral derecho) -->
  <div class="sidebar-tools" *ngIf="!isCollapsed()">
    
    <!-- Switch Edición Directa -->
    <button 
      type="button" 
      (click)="catalogService.toggleEditMode()" 
      class="admin-tool-btn edit-toggle-btn"
      [class.active]="catalogService.isEditMode()"
      [title]="catalogService.isEditMode() ? 'Desactivar edición en pantalla' : 'Activar edición directa en pantalla'">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
      <span>{{ catalogService.isEditMode() ? 'Edición: ON' : 'Edición: OFF' }}</span>
    </button>

    <!-- Botón Agregar Nuevo Servicio -->
    <button 
      type="button" 
      (click)="openNewModal()" 
      class="admin-tool-btn add-btn"
      title="Agregar un nuevo servicio o diseño al catálogo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>+ Nuevo Servicio</span>
    </button>

    <!-- Exportar / Importar Respaldo JSON -->
    <button 
      type="button" 
      (click)="exportBackup()" 
      class="admin-tool-btn reset-btn"
      title="Descargar copia de seguridad JSON de fotos y precios">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Exportar Datos</span>
    </button>

    <label class="admin-tool-btn reset-btn" title="Restaurar respaldo JSON guardado">
      <input type="file" accept="application/json" (change)="onImportBackup($event)" style="display:none" />
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span>Importar Datos</span>
    </label>

    <!-- Botón Restablecer Catálogo -->
    <button 
      type="button" 
      (click)="resetCatalog()" 
      class="admin-tool-btn reset-btn"
      title="Restablecer precios y fotos por defecto">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
      <span>Restablecer</span>
    </button>

    <!-- Botón Salir / Cerrar Sesión -->
    <button 
      type="button" 
      (click)="logout()" 
      class="admin-tool-btn logout-btn"
      title="Cerrar sesión de administrador">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Salir</span>
    </button>

  </div>
</aside>

<!-- MODAL PARA AGREGAR NUEVO SERVICIO / DISEÑO -->
<div *ngIf="showNewModal()" class="admin-modal-backdrop" (click)="closeNewModal()">
  <div class="admin-modal-card card-flat" (click)="$event.stopPropagation()">
    
    <div class="modal-top">
      <div class="modal-title-group">
        <span class="proof-chip">
          <span class="live-dot"></span>
          <span class="caption-2">Catálogo & Lookbook</span>
        </span>
        <h3 class="heading-3">Agregar Nuevo Servicio</h3>
      </div>
      <button type="button" (click)="closeNewModal()" class="close-modal-btn">✕</button>
    </div>

    <form (ngSubmit)="saveNewService()" class="modal-form">
      
      <!-- Nombre del Servicio -->
      <div class="form-group">
        <label class="form-label caption-2">Nombre del servicio:</label>
        <input 
          type="text" 
          [(ngModel)]="newServiceData.name" 
          name="name" 
          placeholder="Ej. Uñas Aura Cromadas 3D" 
          class="form-control body-5" 
          required 
        />
      </div>

      <!-- Categoría y Precio -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label caption-2">Categoría:</label>
          <select [(ngModel)]="newServiceData.category" name="category" class="form-control body-5">
            <option value="manicura">Manicura</option>
            <option value="pedicura">Pedicura</option>
            <option value="estructuras">Nivelación & Rubber</option>
            <option value="sistemas">Sistemas Esculpidos (Polygel/Softgel)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label caption-2">Precio Base (COP):</label>
          <input 
            type="number" 
            [(ngModel)]="newServiceData.basePrice" 
            name="basePrice" 
            placeholder="50000" 
            class="form-control body-5" 
            required 
          />
        </div>
      </div>

      <!-- Duración y Etiqueta/Badge -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label caption-2">Duración estimada:</label>
          <input 
            type="text" 
            [(ngModel)]="newServiceData.durationEstimate" 
            name="duration" 
            placeholder="Aprox. 2h" 
            class="form-control body-5" 
          />
        </div>

        <div class="form-group">
          <label class="form-label caption-2">Etiqueta destacada:</label>
          <input 
            type="text" 
            [(ngModel)]="newServiceData.badge" 
            name="badge" 
            placeholder="Nuevo / Más Solicitado" 
            class="form-control body-5" 
          />
        </div>
      </div>

      <!-- Descripción -->
      <div class="form-group">
        <label class="form-label caption-2">Descripción del servicio:</label>
        <textarea 
          [(ngModel)]="newServiceData.description" 
          name="description" 
          rows="2" 
          placeholder="Describe brevemente lo que incluye este servicio o diseño..." 
          class="form-control body-5">
        </textarea>
      </div>

      <!-- Foto del servicio (Subir archivo con preview) -->
      <div class="form-group">
        <label class="form-label caption-2">Foto del diseño / servicio:</label>
        <div class="photo-upload-wrapper">
          <div *ngIf="previewImageBase64" class="photo-preview-box">
            <img [src]="previewImageBase64" alt="Preview" class="photo-preview-img" />
          </div>
          <div class="file-pick-box">
            <input type="file" accept="image/*" (change)="onFileSelected($event)" id="servicePhotoUpload" class="hidden-file-input" />
            <label for="servicePhotoUpload" class="btn-secondary pick-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
              </svg>
              <span>{{ previewImageBase64 ? 'Cambiar Foto' : 'Seleccionar Foto desde tu Dispositivo' }}</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Botones del Modal -->
      <div class="modal-actions mt-3">
        <button type="button" (click)="closeNewModal()" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar y Publicar en la Página</button>
      </div>

    </form>

  </div>
</div>
