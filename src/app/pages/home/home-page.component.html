<!-- 1. Hero & Featured Studio Showcase -->
<app-hero (selectHeroService)="onServiceSelected($event)"></app-hero>

<!-- 2. Tagline Reveal Section -->
<app-tagline-reveal></app-tagline-reveal>

<!-- 3. Galería Editorial en Movimiento (Carrusel Guiado por Scroll) -->
<app-scroll-carousel (selectDesign)="onCarouselDesignSelected($event)"></app-scroll-carousel>

<!-- 4. Catálogo & Lookbook Unificado (Servicios, Diseños Reales & Tarifas) -->
<app-services-list (selectServiceForQuote)="onServiceSelected($event)"></app-services-list>

<!-- 5. Transformación Antes / Después & Reseñas Verificadas -->
<app-social-proof></app-social-proof>

<!-- 6. Press-On Nails: Uñas Reutilizables a Medida (Envíos Nacionales) -->
<app-press-on></app-press-on>

<!-- 7. Cotizador Exclusivo de Sets Press-On Nails -->
<app-quote-modal
  [preselectedServiceId]="selectedServiceId()"
  [initialNotes]="selectedDesignNote()">
</app-quote-modal>
