<div class="admin-login-page">
  <div class="container login-container">
    <div class="login-card card-flat">
      
      <div class="login-header text-center">
        <a [routerLink]="['/']" class="brand-link">
          <div class="logo-frame">
            <img src="images/logo.jpg" alt="Blue X Style" class="brand-img" />
          </div>
          <span class="brand-title">BLUE X STYLE</span>
        </a>

        <div class="proof-chip mt-3">
          <span class="live-dot"></span>
          <span class="caption-2">Portal Privado de Administración</span>
        </div>

        <h1 class="heading-2 login-title">Gestión de Catálogo & Precios</h1>
        <p class="body-1 text-muted login-desc">
          Ingresa tu clave de acceso para activar el editor en vivo estilo Canva y gestionar fotos, servicios y tarifas.
        </p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        
        <div class="form-group">
          <label class="form-label caption-2">Contraseña de Administrador:</label>
          <div class="password-input-wrap">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              [(ngModel)]="password" 
              name="password" 
              placeholder="Ingresa tu contraseña" 
              class="form-control body-4" 
              required 
              autofocus
            />
            <button 
              type="button" 
              (click)="toggleShowPassword()" 
              class="eye-toggle-btn"
              [title]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span *ngIf="errorMessage()" class="error-text caption-2">{{ errorMessage() }}</span>
        </div>

        <button type="submit" [disabled]="isSubmitting() || !password.trim()" class="btn-primary w-full submit-login-btn">
          <span *ngIf="!isSubmitting()">Acceder al Editor en Vivo</span>
          <span *ngIf="isSubmitting()">Verificando...</span>
          <svg *ngIf="!isSubmitting()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

        <div class="login-footer-hint text-center mt-3">
          <p class="caption-2 text-subtle">
            Clave inicial por defecto: <strong class="text-accent">bluexstyle2026</strong>
          </p>
          <a [routerLink]="['/']" class="back-link caption-2 mt-2">← Volver al sitio público</a>
        </div>

      </form>

    </div>
  </div>
</div>
